# Rows this collection contributes. Every plugin is a SUBPATH of the one package,
# so they all arrive through a single install: the package is `dsh-plugins`, and
# a row named `dsh-plugins/<plugin>` addresses one plugin inside it.
#
# The first row names the package ROOT, and it is load-bearing: a Host composes a
# package's browser half from `exports["./client"]`, and it scans a row for that
# declaration only when the row is the package root. A subpath row alone gets no
# browser bundle. Keeping this row separate from the feature plugins is what lets
# each feature be enabled or disabled on its own.
- insert:
    - id: dsh-plugins-host
      name: 'dsh-plugins'

    - id: opencode-go-usage
      name: 'dsh-plugins/opencode-go-usage'
      config:
        # Quota endpoint of the OpenCode Go subscription.
        endpoint: 'https://opencode.ai/zen/go/v1/usage'
        # Credential reference resolved through ctx.credentials, falling back
        # to the same-named process environment variable.
        credentialRef: 'OPENCODE_GO_API_KEY'
        # How long one upstream answer is reused across callers.
        cacheMs: 5000
        requestTimeoutMs: 15000
        # How often the browser half may re-read on its own, in milliseconds.
        uiRefreshMs: 300000

    - id: better-experience
      name: 'dsh-plugins/better-experience'

    - id: minimax-quota
      name: 'dsh-plugins/minimax-quota'
      config:
        # MiniMax's Chinese cluster. The international base is
        # 'https://api.minimax.io'; both serve the same plan route.
        endpoint: 'https://api.minimax.cn'
        # Credential reference resolved through ctx.credentials, falling back
        # to the same-named process environment variable. This must be the
        # M Plan subscription key (`sk-...`), not a pay-as-you-go `sk-api-` key.
        credentialRef: 'MINIMAX_CN_API_KEY'
        # The plan entry carrying the text/image/audio allowance.
        modelName: 'general'
        # How long one upstream answer is reused across callers.
        cacheMs: 5000
        requestTimeoutMs: 15000
        # How often the browser half may re-read on its own, in milliseconds.
        uiRefreshMs: 300000
